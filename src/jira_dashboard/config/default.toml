[jira]
base_url = "https://jira.invalid"
project_key = "CAE"
team = "Structural Analysis"
team_id = 400
timeout_seconds = 30
page_size = 100
max_retries = 2
closed_lookback_days = 30

[fields]
team = "customfield_12110"
simulation_type = "customfield_15253"
target_start = "customfield_12112"
target_end = "customfield_12113"
sprint = "customfield_10000"
estimated_effort = "timeoriginalestimate"
remaining_effort = "timeestimate"
request_drivers = "components"
epic_link = "customfield_10001"
dyson_project_list = "customfield_12901"

[working_time]
hours_per_day = 8
days_per_week = 5

[requester]
panel_title = "PIC (Requester - Full Name)"
placeholders = ["Requester"]

[issues]
request_types = ["Epic", "Risk", "Issue"]
task_types = ["Task"]
epic_type = "Epic"
task_parent_phrases = ["is child of"]
request_parent_phrases = ["is caused by"]
request_wrong_epic_phrases = ["is child of", "created by"]
excluded_types = ["Sub-task"]

[boards.project_lead]
NEW = "New"
BACKLOG = "Backlog"
PLANNED = "Planned"
IN_PROGRESS = "In Progress"
REFINEMENT = "On Hold"
CLOSED = "Closed"

[boards.active_sprint]
NEW = "To Do"
BACKLOG = "On Hold"
IN_PROGRESS = "In Progress"
PLANNED = "In Review"
CLOSED = "Done"

[risk]
amber_days_before_target = 3
stale_after_days = 5

[app]
name = "VE Jira Operations Dashboard"

[logging]
level = "INFO"
directory = "logs"
